name: Build PowerTools

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Dateien in die richtige Struktur sortieren
        run: |
          mkdir -p src/main/java/de/powertools src/main/resources
          mv *.java src/main/java/de/powertools/
          mv config.yml plugin.yml src/main/resources/

      - name: Plugin bauen
        run: mvn -B clean package

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools
          path: target/PowerTools.jar
