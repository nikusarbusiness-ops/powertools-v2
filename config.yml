# PowerTools Konfiguration

items:
  # Nach so vielen Tagen (Echtzeit) zerfällt JEDES PowerTools-Item von selbst.
  # 0 = Items zerfallen nie.
  lifetime-days: 5

# Optional: Texturen-Resourcepack automatisch an Spieler senden.
# Alternativ die URL in server.properties bei "resource-pack=" eintragen.
resource-pack:
  enabled: false
  url: ""
  # SHA-1 der ZIP (40 Zeichen, optional)
  sha1: ""

# Drill & Pickaxe: bauen nur Blöcke ab, für die eine Spitzhacke das richtige Werkzeug ist
only-preferred-tool: true

blitz-drill:
  # Tiefe des 3x3-Tunnels (1 = flache 3x3-Fläche, 3 = 3x3x3 Würfel)
  depth: 3

blitz-pickaxe:
  # Tiefe des 3x3-Abbaus
  depth: 1

blitz-axe:
  max-logs: 300
  # Nur "echte" Bäume fällen (mit natürlichen Blättern), keine gebauten Holzhäuser
  require-leaves: true

blitz-schaufel:
  # Diese Blöcke werden im 3x3-Bereich abgegraben
  blocks:
    - DIRT
    - GRASS_BLOCK
    - COARSE_DIRT
    - ROOTED_DIRT
    - PODZOL
    - MYCELIUM
    - DIRT_PATH
    - FARMLAND
    - MUD
    - SAND
    - RED_SAND
    - GRAVEL
    - CLAY
    - SOUL_SAND
    - SOUL_SOIL

blitz-sell-axe:
  cooldown-ms: 500

blitz-eimer:
  # So viele Eimer Wasser passen in den Blitz Eimer
  capacity: 21

# Verkaufspreise pro Item (Blitz Sell Axe, braucht Vault + Economy-Plugin)
