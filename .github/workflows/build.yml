name: Build PowerTools

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK einrichten (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Maven-Build ausführen (mit optimiertem Speicher)
        run: mvn -B clean package
        env:
          MAVEN_OPTS: "-Xmx1024m -XX:MaxMetaspaceSize=512m"

      - name: Artifacts speichern (JAR-Datei)
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-JAR
          path: target/*.jar
